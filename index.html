    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "name": "Neura",
            "description": "Adaptive Socratic AI tutor for children ages 5 to 12.",
            "url": "/"
          },
          {
            "@type": "FAQPage",
            "mainEntity": [
              {
                "@type": "Question",
                "name": "What ages is Neura for?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Neura is built for children ages 5 to 12, covering Pre-K through Grade 6 with age-calibrated tone and grade-aligned curriculum."
                }
              },
              {
                "@type": "Question",
                "name": "Is it safe for my child to use alone?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Yes. There is no open-ended chat. Every lesson is structured, validated for safety and age-appropriateness before your child sees it, and guided step by step."
                }
              },
              {
                "@type": "Question",
                "name": "What subjects does it cover?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Neura covers Maths, English/Reading, Phonics, Science, Social Studies, Coding basics, and Life skills across grades Pre-K to 6."
                }
              },
              {
                "@type": "Question",
                "name": "Does my child need an account?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "No separate child account or email is required. Parents set up a local profile in 60 seconds."
                }
              },
              {
                "@type": "Question",
                "name": "Where is my child's data stored?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Your child's profile and learning progress stay right in your browser. No names or emails are ever sent to the AI lesson generator."
                }
              },
              {
                "@type": "Question",
                "name": "Does Neura replace a teacher or tutor?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "No. Neura complements school and tutoring by helping kids build understanding at home without tears or answer-copying."
                }
              },
              {
                "@type": "Question",
                "name": "How is this different from ChatGPT or YouTube?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "YouTube is passive and open chatbots give away answers or drift off-topic. Neura uses Socratic hints, interactive visuals, and strict safety validation."
                }
              }
            ]
          }
        ]
      }
